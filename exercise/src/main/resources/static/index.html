<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="my-4 text-center">📚 Biblioteca Digital</h1>
        
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h2>Agregar Recurso</h2>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Tipo de recurso:</label>
                    <select id="resourceType" class="form-select">
                        <option value="libro">📖 Libro</option>
                        <option value="periodico">📰 Periódico</option>
                        <option value="computador">💻 Computador</option>
                    </select>
                </div>
                
                <div id="formsContainer"></div>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <h2>Recursos Existentes</h2>
                <div>
                    <select id="filterType" class="form-select">
                        <option value="todos">Todos</option>
                        <option value="libro">Libros</option>
                        <option value="periodico">Periódicos</option>
                        <option value="computador">Computadores</option>
                    </select>
                </div>
            </div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tipo</th>
                            <th>Nombre</th>
                            <th>Detalles</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="resourcesTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
